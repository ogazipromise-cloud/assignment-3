name: CI

on:
push:
pull_request:

jobs:
validate:
name: Validate
runs-on: ubuntu-latest


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Make scripts executable
    run: chmod +x app/*.sh scripts/*.sh tests/*.sh

  - name: Run linting
    run: ./scripts/lint.sh


test:
name: Test
runs-on: ubuntu-latest
needs: validate


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Make scripts executable
    run: chmod +x app/*.sh tests/*.sh

  - name: Run application tests
    run: ./tests/test.sh

docker:
name: Docker Build and Smoke Tests
runs-on: ubuntu-latest
needs: test


steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Make build script executable
    run: chmod +x scripts/build.sh

  - name: Build Docker image and run smoke tests
    run: ./scripts/build.sh

